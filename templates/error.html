{% extends "base.html" %}
{% block title %}{{ title }} · All-In-One Studio{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl rounded-3xl border border-white/[.09] bg-[#111722]/80 p-8 text-center sm:p-12">
  <span class="mx-auto grid h-12 w-12 place-items-center rounded-2xl bg-amber-300/10 text-xl text-amber-200">!</span>
  <h1 class="mt-5 text-2xl font-semibold">{{ title }}</h1>
  <p class="mt-3 text-sm leading-6 text-slate-400">{{ message }}</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="mt-7 inline-flex rounded-xl bg-emerald-300 px-5 py-3 text-sm font-semibold text-slate-950 transition hover:bg-emerald-200">Back to studio</a>
</section>
{% endblock %}
