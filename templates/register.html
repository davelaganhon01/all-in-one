{% extends "base.html" %}
{% block title %}Create account · All-In-One Studio{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl">
  <div class="glass rounded-3xl border border-white/[.09] p-7 shadow-2xl shadow-black/30 sm:p-10">
    <p class="mono text-xs uppercase tracking-[.2em] text-emerald-200/70">Get started</p>
    <h1 class="mt-3 text-3xl font-semibold tracking-tight">Create your account</h1>
    <p class="mt-2 text-sm leading-6 text-slate-400">The first account becomes the studio owner. New accounts are reviewed before access is enabled.</p>
    <form method="post" class="mt-8 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="block">
        <span class="mb-2 block text-sm text-slate-300">Username</span>
        <input name="username" required minlength="3" maxlength="40" autocomplete="username" pattern="[A-Za-z0-9_.-]{3,40}" class="w-full rounded-xl border border-white/10 bg-[#0b1019] px-4 py-3 text-sm outline-none transition focus:border-emerald-300/60" placeholder="musicfan">
        <span class="mt-1.5 block text-xs text-slate-500">3–40 letters, numbers, dots, dashes, or underscores.</span>
      </label>
      <label class="block">
        <span class="mb-2 block text-sm text-slate-300">Email</span>
        <input name="email" type="email" required maxlength="254" autocomplete="email" class="w-full rounded-xl border border-white/10 bg-[#0b1019] px-4 py-3 text-sm outline-none transition focus:border-emerald-300/60" placeholder="you@example.com">
      </label>
      <label class="block">
        <span class="mb-2 block text-sm text-slate-300">Password</span>
        <input name="password" type="password" required minlength="12" autocomplete="new-password" class="w-full rounded-xl border border-white/10 bg-[#0b1019] px-4 py-3 text-sm outline-none transition focus:border-emerald-300/60" placeholder="At least 12 characters">
      </label>
      <button class="w-full rounded-xl bg-emerald-300 px-4 py-3.5 text-sm font-semibold text-slate-950 transition hover:bg-emerald-200">Create account</button>
    </form>
    <p class="mt-7 text-center text-sm text-slate-500">Already have an account? <a href="{{ url_for('login') }}" class="text-emerald-200 transition hover:text-white">Sign in</a></p>
  </div>
</section>
{% endblock %}
